<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ve más allá de la web</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h1>ve más allá de la web</h1>
      <p>Diseñamos la página web de tus sueños</p>
    </div>

    <!-- FORMULARIO -->
    <form id="pedidoForm" class="pedido-form" novalidate>

      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="celular">Número de celular</label>
          <input type="tel" id="celular" name="celular" required placeholder="+51 987 654 321">
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" required placeholder="juan@email.com">
        </div>
      </div>

      <div class="form-group">
        <label for="tipoPagina">Tipo de página web</label>
        <select id="tipoPagina" name="tipoPagina" required>
          <option value="">Selecciona un tipo</option>
          <option value="landing">Landing Page (1 página)</option>
          <option value="empresa">Página Empresarial (5-10 páginas)</option>
          <option value="ecommerce">Tienda Online (E-commerce)</option>
          <option value="blog">Blog Personal / Profesional</option>
          <option value="portfolio">Portafolio</option>
          <option value="otro">Otro (especificar)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción de lo que quieres</label>
        <textarea id="descripcion" name="descripcion" rows="4" required
          placeholder="Describe tu página: colores, estilo, secciones, funcionalidades…"></textarea>
      </div>

      <div class="form-group">
        <label for="imagenReferencia">Imagen de referencia (opcional)</label>
        <input type="file" id="imagenReferencia" name="imagenReferencia" accept="image/*">
        <small>Sube una imagen de cómo quieres que se vea tu página</small>
      </div>

      <div class="form-divider">Detalles adicionales</div>

      <div class="form-row">
        <div class="form-group">
          <label for="presupuesto">Presupuesto estimado (USD)</label>
          <input type="number" id="presupuesto" name="presupuesto" placeholder="Ej: 500" step="50" min="0">
        </div>
        <div class="form-group">
          <label for="fechaLimite">Fecha deseada de entrega</label>
          <input type="date" id="fechaLimite" name="fechaLimite">
        </div>
      </div>

      <button type="submit" class="btn-submit"><span>📨 Enviar Solicitud</span></button>

    </form>

    <div id="mensaje" class="mensaje"></div>

    <p class="footer-note">TuWebPerfecta © 2025 — Diseño & Desarrollo Web</p>

  </div>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Script principal -->
  <script src="script.js"></script>

</body>
</html>
